name: Generar voz del video
on:
  push:
    branches: [video-voz]
    paths: ["tts/guion.json", "tts/gen.py"]
permissions:
  contents: write
jobs:
  voz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: sudo apt-get install -y -q espeak-ng
      - run: pip install -q "kokoro>=0.9" soundfile && mkdir -p tts/out && python tts/gen.py
      - run: |
          git config user.name "cerquita-bot"; git config user.email "bot@users.noreply.github.com"
          git add tts/out && git commit -m "Voz generada" && git push
