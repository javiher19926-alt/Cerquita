plugins { id "com.android.application" }

def ks = System.getenv("CQ_KEYSTORE")

android {
    namespace "ni.cerquita.app"
    compileSdk 35
    defaultConfig {
        minSdk 24
        targetSdk 35
        versionCode((System.getenv("GITHUB_RUN_NUMBER") ?: "1") as int)
        versionName "1.0." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
    }
    signingConfigs {
        fixed {
            storeFile rootProject.file("cerquita-debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        release {
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("CQ_STORE_PASS")
                keyAlias System.getenv("CQ_KEY_ALIAS")
                keyPassword System.getenv("CQ_KEY_PASS")
            }
        }
    }
    flavorDimensions "app"
    productFlavors {
        cliente {
            dimension "app"
            applicationId "ni.cerquita.cliente"
            resValue "string", "app_name", "Cerquita"
            buildConfigField "String", "START_URL", '"https://javiher19926-alt.github.io/Cerquita/"'
            buildConfigField "String", "SCOPE", '"/Cerquita/"'
        }
        equipo {
            dimension "app"
            applicationId "ni.cerquita.equipo"
            resValue "string", "app_name", "Cerquita Equipo"
            buildConfigField "String", "START_URL", '"https://javiher19926-alt.github.io/Cerquita/equipo/"'
            buildConfigField "String", "SCOPE", '"/Cerquita/"'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig ks ? signingConfigs.release : signingConfigs.fixed
        }
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.biometric:biometric:1.1.0"
    implementation "androidx.core:core:1.13.1"
}
